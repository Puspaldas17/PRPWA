<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, -apple-system, Roboto, sans-serif">
  <rect width="100%" height="100%" fill="#0b1120" rx="14" />
  <rect x="6" y="6" width="888" height="308" fill="none" stroke="#1e293b" stroke-width="2" rx="10" />

  <text x="450" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#38bdf8">Follow Me Mode — Ultrasonic Distance Bands &amp; Hysteresis</text>
  <text x="450" y="58" text-anchor="middle" font-size="12" fill="#94a3b8">HC-SR04 Target Tracking with ±3 cm Anti-Chatter Deadbands</text>

  <!-- Distance Bar Background -->
  <rect x="50" y="90" width="800" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />

  <!-- Zone 1: Reverse -->
  <rect x="50" y="90" width="130" height="50" rx="6 0 0 6" fill="#7f1d1d" />
  <text x="115" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#fca5a5">↩ REVERSE</text>
  <text x="115" y="132" text-anchor="middle" font-size="9" fill="#fecaca">&lt; 12 cm</text>

  <!-- Hysteresis 1 -->
  <rect x="180" y="90" width="45" height="50" fill="#78350f" stroke="#b45309" stroke-dasharray="3 2" />
  <text x="202" y="120" text-anchor="middle" font-size="8" fill="#fde68a">HYST</text>

  <!-- Zone 2: Hold -->
  <rect x="225" y="90" width="180" height="50" fill="#713f12" />
  <text x="315" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#fef08a">⏸ HOLD POSITION</text>
  <text x="315" y="132" text-anchor="middle" font-size="9" fill="#fef9c3">15 – 30 cm</text>

  <!-- Hysteresis 2 -->
  <rect x="405" y="90" width="45" height="50" fill="#78350f" stroke="#b45309" stroke-dasharray="3 2" />
  <text x="427" y="120" text-anchor="middle" font-size="8" fill="#fde68a">HYST</text>

  <!-- Zone 3: Forward -->
  <rect x="450" y="90" width="240" height="50" fill="#14532d" />
  <text x="570" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#86efac">▶ FORWARD</text>
  <text x="570" y="132" text-anchor="middle" font-size="9" fill="#dcfce7">33 – 60 cm</text>

  <!-- Zone 4: Lost -->
  <rect x="690" y="90" width="160" height="50" rx="0 6 6 0" fill="#334155" />
  <text x="770" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#cbd5e1">⏹ STOP (Target Lost)</text>
  <text x="770" y="132" text-anchor="middle" font-size="9" fill="#94a3b8">&gt; 60 cm / no echo &gt; 400ms</text>

  <!-- Markers -->
  <text x="50" y="160" font-size="10" fill="#94a3b8">0 cm</text>
  <text x="180" y="160" font-size="10" fill="#f87171">12 cm</text>
  <text x="225" y="160" font-size="10" fill="#fde047">15 cm</text>
  <text x="405" y="160" font-size="10" fill="#fde047">30 cm</text>
  <text x="450" y="160" font-size="10" fill="#4ade80">33 cm</text>
  <text x="690" y="160" font-size="10" fill="#94a3b8">60 cm</text>

  <!-- Legend Cards -->
  <g transform="translate(50, 180)">
    <rect x="0" y="0" width="180" height="70" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1" />
    <text x="90" y="24" text-anchor="middle" font-size="11" font-weight="bold" fill="#f87171">Too Close (&lt; 12 cm)</text>
    <text x="90" y="42" text-anchor="middle" font-size="9" fill="#cbd5e1">Car backs away to avoid</text>
    <text x="90" y="56" text-anchor="middle" font-size="9" fill="#cbd5e1">collision with target.</text>
  </g>
  <g transform="translate(255, 180)">
    <rect x="0" y="0" width="180" height="70" rx="6" fill="#1e293b" stroke="#eab308" stroke-width="1" />
    <text x="90" y="24" text-anchor="middle" font-size="11" font-weight="bold" fill="#fde047">Sweet Spot (15 – 30 cm)</text>
    <text x="90" y="42" text-anchor="middle" font-size="9" fill="#cbd5e1">Motors stop, car holds</text>
    <text x="90" y="56" text-anchor="middle" font-size="9" fill="#cbd5e1">steady position in place.</text>
  </g>
  <g transform="translate(460, 180)">
    <rect x="0" y="0" width="180" height="70" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1" />
    <text x="90" y="24" text-anchor="middle" font-size="11" font-weight="bold" fill="#4ade80">Follow Range (33 – 60 cm)</text>
    <text x="90" y="42" text-anchor="middle" font-size="9" fill="#cbd5e1">Car drives forward smoothly</text>
    <text x="90" y="56" text-anchor="middle" font-size="9" fill="#cbd5e1">at reduced follow speed.</text>
  </g>
  <g transform="translate(665, 180)">
    <rect x="0" y="0" width="185" height="70" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1" />
    <text x="92" y="24" text-anchor="middle" font-size="11" font-weight="bold" fill="#94a3b8">Target Lost (&gt; 60 cm)</text>
    <text x="92" y="42" text-anchor="middle" font-size="9" fill="#cbd5e1">No target in view.</text>
    <text x="92" y="56" text-anchor="middle" font-size="9" fill="#cbd5e1">Hard stops safely.</text>
  </g>
</svg>